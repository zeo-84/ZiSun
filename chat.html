<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زی‌چت - ZiSun</title>

    <!-- ✅ اعمال تم قبل از رندر -->
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <!-- فونت‌ها -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

    <!-- استایل‌ها -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages/chat.css">
</head>
<body>

    <!-- هدر -->
    <header class="chat-header" role="banner">
        <div class="chat-header__container">
            <a href="index.html" class="chat-header__back" aria-label="بازگشت به صفحه اصلی">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>

            <div class="chat-header__profile">
                <div class="chat-header__avatar">
                    <img src="assets/images/zichat.webp" alt="زی‌چت" class="chat-header__avatar-img" onerror="this.parentElement.innerHTML='🤖'">
                </div>
                <div class="chat-header__info">
                    <h1 class="chat-header__title">زی‌چت</h1>
                    <span class="chat-header__status">
                        <span class="status-dot"></span>
                        آنلاین و آماده پاسخگویی
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- بدنه چت -->
    <main class="chat-body" id="chatBody" role="main">
        <!-- پیام خوش‌آمدگویی -->
        <div class="chat-message bot-message">
            <div class="chat-message__avatar">
                <img src="assets/images/zichat.webp" alt="زی‌چت" onerror="this.parentElement.innerHTML='🤖'">
            </div>
            <div class="chat-message__content">
                <p>سلام!  من <strong>زی‌چت</strong> هستم، دستیار هوشمند زیسان!</p>
                <p>هر سوالی درباره محصولات، سایزبندی یا سفارش داری، از من بپرس! ✨</p>
                <span class="chat-message__time">الان</span>
            </div>
        </div>
    </main>

    <!-- بخش ورودی + سوالات متداول -->
    <footer class="chat-input-area" role="contentinfo">
        <div class="chat-input-container">
            <!-- سوالات متداول (اسکرول افقی) -->
            <div class="quick-questions-scroll" id="quickQuestions">
                <!-- دکمه‌ها توسط JavaScript پر می‌شوند -->
            </div>

            <!-- کادر تایپ -->
            <div class="chat-input-wrapper">
                <input
                    type="text"
                    class="chat-input"
                    id="chatInput"
                    placeholder="سوالت رو بنویس..."
                    autocomplete="off"
                    maxlength="50"
                    aria-label="پیام شما"
                >
                <button class="chat-send-btn" id="chatSendBtn" aria-label="ارسال پیام">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </footer>

    <!-- دیتابیس سوالات -->
    <script src="js/data/chat-questions.js"></script>

    <!-- منطق صفحه چت -->
    <script type="module" src="js/pages/chat.js"></script>
</body>
</html>
