<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <!-- ============================================
         📋 Meta Tags
         ============================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- SEO Meta Tags -->
    <meta name="description" content="زیسان - طراحی لباس سفارشی با سبک منحصربه‌فرد. لباس‌های مجلسی، روزمره و عروس با کیفیت بالا">
    <meta name="keywords" content="طراحی لباس, زیسان, لباس سفارشی, لباس مجلسی, مد و فشن, طراحی مد">
    <meta name="author" content="ZiSun Fashion">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zisUn.ir/">
    <meta property="og:title" content="زیسان - ZiSun Fashion">
    <meta property="og:description" content="طراحی لباس سفارشی با سبک منحصربه‌فرد">
    <meta property="og:image" content="assets/images/og-image.jpg">
    <meta property="og:locale" content="fa_IR">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://zisUn.ir/">
    <meta property="twitter:title" content="زیسان - ZiSun Fashion">
    <meta property="twitter:description" content="طراحی لباس سفارشی با سبک منحصربه‌فرد">
    <meta property="twitter:image" content="assets/images/og-image.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- Title -->
    <title>زیسان - ZiSun Fashion | طراحی لباس سفارشی</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- ============================================
         ⏳ Loading Screen
         ============================================ -->
    <div class="loading-screen" aria-hidden="true">
        <svg class="loading__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <h1 class="loading__logo">ZiSun</h1>
        <div class="loading__progress">
            <div class="loading__progress-bar"></div>
        </div>
        <p class="loading__tagline">Made for sunny souls</p>
    </div>

    <!-- ============================================
         🎨 Header & Navigation
         ============================================ -->
    <header class="header" role="banner" style="position: sticky; top: 0; z-index: 100; background: var(--color-glass-bg); backdrop-filter: blur(10px); padding: var(--spacing-sm) 0;">
        <div class="container flex-between" style="align-items: center;">
            <!-- لوگو سمت چپ -->
            <div class="header__logo-wrapper" style="display: flex; align-items: center;">
                <img src="assets/images/logo.png" alt="لوگو زیسان" class="header__logo" style="width: 32px; height: 32px; object-fit: contain;">
            </div>

            <!-- نام برند -->
            <h1 class="font-brand" style="font-size: var(--font-size-xl); margin: 0;">ZiSun</h1>

            <!-- جستجو و تم -->
            <div class="flex gap-sm" style="align-items: center;">
                <input type="search" class="search-input input-glass" placeholder="جستجو..." style="width: 120px; padding: 6px 12px; font-size: var(--font-size-sm); margin: 0;">
                <button class="theme-toggle" aria-label="تغییر تم" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="width: 16px; height: 16px;">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- ============================================
         🎬 Main Content
         ============================================ -->
    <main role="main">
        <!-- Hero Section -->
        <section class="hero" aria-label="معرفی برند زیسان">
            <div class="hero__stars" aria-hidden="true"></div>
            <div class="hero__content">
                <!-- متن انگلیسی -->
                <h2 class="hero__title">Made for sunny souls</h2>

                <!-- خط تزئینی -->
                <div class="hero__divider-line"></div>

                <!-- متن فارسی -->
                <p class="hero__subtitle">طراحی لباس سفارشی با سبک منحصربه‌فرد</p>

                <!-- ============================================
                     🎠 Swiper Slider - فقط عکس (مینیمال)
                     ============================================ -->
                <div class="swiper ziSun-slider" aria-label="اسلایدشو محصولات">
                    <div class="swiper-wrapper">
                        <!-- اسلاید 1 -->
                        <div class="swiper-slide">
                            <img src="assets/images/s1.webp" alt="وست عروسکی" loading="lazy">
                        </div>

                        <!-- اسلاید 2 -->
                        <div class="swiper-slide">
                            <img src="assets/images/s2.webp" alt="وست و شلوار" loading="lazy">
                        </div>

                        <!-- اسلاید 3 -->
                        <div class="swiper-slide">
                            <img src="assets/images/s3.webp" alt="پیراهن تابستانه" loading="lazy">
                        </div>

                        <!-- اسلاید 4 -->
                        <div class="swiper-slide">
                            <img src="assets/images/s4.webp" alt="شومیز مانتویی " loading="lazy">
                        </div>
                    </div>

                    <!-- نقطه‌ها -->
                    <div class="swiper-pagination"></div>

                    <!-- فلش‌ها -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
            </div>
        </section>
     <!-- ============================================
     🎯 Connect Section - آیکون‌های ارتباطی
     ============================================ -->
<section class="connect-section" aria-label="راه‌های ارتباطی">
    <h2 class="connect-title">ارتباط با زیسان</h2>

    <div class="connect-icons" role="list">
        <!-- Telegram -->
        <a href="https://t.me/zison_fashion"
           target="_blank"
           rel="noopener noreferrer"
           class="connect-icon"
           title="Telegram"
           role="listitem"
           aria-label="تلگرام زیسان">
            <svg class="connect-icon__svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
            </svg>
        </a>

        <!-- Instagram -->
        <a href="https://instagram.com/zison_fashion"
           target="_blank"
           rel="noopener noreferrer"
           class="connect-icon"
           title="Instagram"
           role="listitem"
           aria-label="اینستاگرام زیسان">
            <svg class="connect-icon__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
            </svg>
        </a>

        <!-- SMS -->
        <a href="sms:+989123456789"
           class="connect-icon"
           title="SMS"
           role="listitem"
           aria-label="پیامک به زیسان">
            <svg class="connect-icon__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
        </a>

        <!-- Phone -->
        <a href="tel:+989123456789"
           class="connect-icon"
           title="Phone"
           role="listitem"
           aria-label="تماس با زیسان">
            <svg class="connect-icon__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
        </a>
    </div>
</section>


        <!-- Products Section -->
        <section class="products" id="products" aria-label="لیست محصولات">
            <div class="products__header">
                <h2 class="products__title">لیست محصولات</h2>
                <div class="products__divider"></div>
                <p class="products__subtitle">جدیدترین طراحی‌های زیسان</p>
            </div>
            <div class="products__grid">
                <!-- محصولات توسط JavaScript لود می‌شن -->
            </div>
        </section>
        <!-- ============================================
     🤖 ZiChat Character - کاراکتر انیمیشنی
     ============================================ -->
<section class="zichat-section" aria-label="زی‌چت دستیار هوشمند">
    <!-- کاراکتر ربات -->
    <div class="zichat-character" id="zichatCharacter">
        <!-- بدن ربات -->
        <div class="zichat-body">
            <!-- آنتن -->
            <div class="zichat-antenna">
                <div class="zichat-antenna-ball"></div>
            </div>

            <!-- چشم‌ها -->
            <div class="zichat-eyes">
                <div class="zichat-eye">
                    <div class="zichat-pupil"></div>
                </div>
                <div class="zichat-eye">
                    <div class="zichat-pupil"></div>
                </div>
            </div>

            <!-- گونه‌ها -->
            <div class="zichat-cheek zichat-cheek--left"></div>
            <div class="zichat-cheek zichat-cheek--right"></div>

            <!-- لبخند -->
            <div class="zichat-mouth"></div>
        </div>

        <!-- حباب گفتگو -->
        <div class="zichat-bubble">
            <p class="zichat-typing-text" id="zichatTypingText"></p>
            <span class="zichat-cursor">|</span>
        </div>
    </div>

    <!-- عنوان -->
    <h3 class="zichat-title">زی‌چت - دستیار هوشمند زیسان</h3>
    <p class="zichat-subtitle">هر سوالی داری، از من بپرس!</p>

    <!-- دکمه باز کردن چت -->
    <button class="zichat-button" id="zichatOpenBtn" aria-label="باز کردن چت با زی‌چت">
        <span> شروع گفتگو</span>
    </button>
</section>
    </main>
   <!-- ============================================
      Bottom Navigation - ۳ آیتم
     ============================================ -->
<nav class="bottom-nav" role="navigation" aria-label="ناوبری اصلی">
    <!-- خانه (راست در RTL) -->
    <a href="#" class="bottom-nav__item is-active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="bottom-nav__label">خانه</span>
    </a>

    <!-- زی‌چت (وسط) -->
    <a href="#" class="bottom-nav__item bottom-nav__item--zichat" id="bottomNavZichat" aria-label="زی‌چت">
        <div class="bottom-nav__zichat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
        </div>
        <span class="bottom-nav__label">زی‌چت</span>
    </a>

    <!-- محصولات (چپ در RTL) -->
    <a href="#products" class="bottom-nav__item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="bottom-nav__label">محصولات</span>
    </a>
</nav>

    <!-- ============================================
          Scripts
         ============================================ -->

    <!-- Swiper JS (قبل از main.js) -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Main App (ES6 Module) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
